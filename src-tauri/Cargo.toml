[package]
name = "webp-converter"
version = "1.0.0"
description = "WebP 图片转换工具 - 支持 PNG/JPG/JPEG 转 WebP"
authors = ["WebP Tool Contributors"]
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/webp-tool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
walkdir = "2"
webp = "0.3"
libwebp-sys = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
